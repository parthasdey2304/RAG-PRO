[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Parth Vastavik", email = "131694386+parthasdey2304@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.110.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "lancedb>=0.41.0",
    "langchain-community>=0.4.2",
    "langchain-google-vertexai>=3.3.0",
    "langchain-ollama>=1.2.0",
    "numpy>=2.5.5",
    "openai>=3.58.0",
    "pillow>=13.0.0",
    "pydantic>=2.0",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "ragas>=0.3.1",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
